html/custom_html_shell=""
html/head_include="<script>
// itch.io's mobile frame keeps the height it had when the game was launched upright, so after
// turning the phone it is taller than the screen and the game sits half off it. Godot sizes the
// game from innerWidth/innerHeight, so inside a frame they never exceed the screen.
// iOS keeps screen.width/height in portrait when turned, so the limits use the long and
// short side: a frame wider than the short side is landscape and gets the short side as height.
(function () {
	if (window === window.top) return;
	const width = Object.getOwnPropertyDescriptor(window, 'innerWidth');
	const height = Object.getOwnPropertyDescriptor(window, 'innerHeight');
	if (!width || !width.get || !height || !height.get) return;
	const longSide = () => Math.max(screen.width, screen.height);
	const shortSide = () => Math.min(screen.width, screen.height);
	const ownWidth = () => width.get.call(window);
	Object.defineProperty(window, 'innerWidth', {
		configurable: true,
		get: () => Math.min(ownWidth(), longSide()),
	});
	Object.defineProperty(window, 'innerHeight', {
		configurable: true,
		get: () => Math.min(height.get.call(window), ownWidth() > shortSide() ? shortSide() : longSide()),
	});
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
