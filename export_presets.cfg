[preset.0]

name="Web Demo"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="demo"
export_filter="all_resources"
include_filter=""
exclude_filter="dev/*, tests/*, addons/dev_resource_tools/*, addons/pp_test_tools/*, addons/sound_board/*, src/console/batch_cheat_commands.gd, src/console/world_cheat_commands.gd, src/console/dev_mode_commands.gd"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>
// itch.io's mobile frame keeps the height it had when the game was launched upright, so after
// turning the phone it is taller than the screen and the game sits half off it. Godot sizes the
// game from innerWidth/innerHeight, so inside a frame they never exceed the screen.
(function () {
	if (window === window.top) return;
	for (const [name, limit] of [['innerWidth', () => screen.width], ['innerHeight', () => screen.height]]) {
		const own = Object.getOwnPropertyDescriptor(window, name);
		if (!own || !own.get) continue;
		Object.defineProperty(window, name, {
			configurable: true,
			get: () => Math.min(own.get.call(window), limit()),
		});
	}
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
